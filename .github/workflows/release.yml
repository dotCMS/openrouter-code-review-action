name: Release

on:
  release:
    types: [published, edited]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false
  queue: max

jobs:
  retag:
    name: Point the moving major tag and latest at the newest release
    runs-on: ubuntu-latest
    steps:
      - name: Update the moving major and latest tags
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            if (context.payload.release.draft || context.payload.release.prerelease) {
              core.info('Draft/prerelease releases do not advance stable moving tags.');
              return;
            }
            const tag = context.payload.release.tag_name || '';

            // Only strict semver tags are managed here. Non-semver tags (for
            // example legacy placeholders) are ignored: no promotion/retag, so
            // @v1 consumers are never silently moved.
            const match = /^v(\d+)\.(\d+)\.(\d+)$/.exec(tag);
            if (!match) {
              core.info(`Release tag ${tag} is not semver (vX.Y.Z); skipping retag.`);
              return;
            }
            const version = match.slice(1).map((n) => parseInt(n, 10));
            const compare = (a, b) => {
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] - b[i];
              }
              return 0;
            };
            const format = (v) => `v${v.join('.')}`;

            async function resolveCommitSha(t) {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${t}` });
              let sha = ref.data.object.sha;
              if (ref.data.object.type === 'tag') {
                const tagObj = await github.rest.git.getTag({ owner, repo, tag_sha: sha });
                sha = tagObj.data.object.sha; // commit SHA
              }
              return sha;
            }

            // Highest published (non-draft, non-prerelease) semver release
            // overall and within this major. Unpublished/orphan tags must not
            // hold back promotion of a published release.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            let maxOverall = null;
            let maxMajor = null;
            for (const r of releases) {
              if (r.draft || r.prerelease) continue;
              const m = /^v(\d+)\.(\d+)\.(\d+)$/.exec(r.tag_name || '');
              if (!m) continue;
              const v = m.slice(1).map((n) => parseInt(n, 10));
              if (maxOverall === null || compare(v, maxOverall) > 0) maxOverall = v;
              if (v[0] === version[0] && (maxMajor === null || compare(v, maxMajor) > 0)) maxMajor = v;
            }

            const targetSha = await resolveCommitSha(tag);

            async function upsertTag(name) {
              const shortRef = `tags/${name}`;
              const fullRef = `refs/${shortRef}`;
              try {
                await github.rest.git.updateRef({ owner, repo, ref: shortRef, sha: targetSha, force: true });
                core.info(`Updated ${fullRef} -> ${targetSha}`);
              } catch (err) {
                if (err.status === 422) {
                  await github.rest.git.createRef({ owner, repo, ref: fullRef, sha: targetSha });
                  core.info(`Created ${fullRef} -> ${targetSha}`);
                } else {
                  core.setFailed(`Failed to upsert ${fullRef}: ${err.message}`);
                }
              }
            }

            // Only ever move a ref forward: editing an older release must not
            // repoint v<major> or latest to an older commit.
            if (maxMajor !== null && compare(version, maxMajor) >= 0) {
              await upsertTag(`v${version[0]}`);
            } else {
              core.info(`Release ${tag} is not the newest v${version[0]}; skipping v${version[0]}.`);
            }

            if (maxOverall !== null && compare(version, maxOverall) >= 0) {
              await upsertTag('latest');
            } else {
              core.info(`Release ${tag} is older than ${maxOverall ? format(maxOverall) : 'the latest'}; skipping latest.`);
            }
