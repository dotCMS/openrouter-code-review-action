name: Auto Release on Merge

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Cut next release (breaking -> major, feat -> minor, otherwise patch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -z "$latest" ]; then
            echo "No existing version tags; skipping auto-release."
            exit 0
          fi
          log_subjects=$(git log "$latest"..HEAD --pretty=%s)
          log_bodies=$(git log "$latest"..HEAD --pretty=%b)
          is_breaking=false
          # Conventional Commits breaking marker: "type(scope)!: ...".
          if grep -qE '^[a-zA-Z]+(\([^)]*\))?!:' <<< "$log_subjects"; then
            is_breaking=true
          fi
          # "BREAKING CHANGE:"/"BREAKING-CHANGE:" footer in the commit body.
          if grep -qE '^BREAKING[ -]CHANGE:' <<< "$log_bodies"; then
            is_breaking=true
          fi
          has_feat=$(printf '%s\n' "$log_subjects" | grep -cE '^feat(\([^)]*\))?!?:' || true)
          major=$(echo "$latest" | sed -E 's/^v([0-9]+).*/\1/')
          minor=$(echo "$latest" | sed -E 's/^v[0-9]+\.([0-9]+).*/\1/')
          patch=$(echo "$latest" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+).*/\1/')
          if [ "$is_breaking" = true ]; then
            bump='breaking'
            major=$((major + 1))
            minor=0
            patch=0
          elif [ "$has_feat" -gt 0 ]; then
            bump='feat'
            minor=$((minor + 1))
            patch=0
          else
            bump='patch'
            patch=$((patch + 1))
          fi
          next="v${major}.${minor}.${patch}"
          echo "Cutting ${next} (prior ${latest}, bump=${bump})"
          git tag -a "$next" -m "dotbot code review ${next}"
          git push origin "$next"
          gh release create "$next" \
            --title "dotbot code review ${next}" \
            --latest \
            --notes "Auto-generated release from merge to main."
          # Move only this release's major tag and latest. Never repoint v1 at a
          # v2 release (or vice versa), so existing @v1 consumers stay on v1. use
          # updateRef with force (atomic) rather than delete+create to avoid
          # racing the separate release-published retag workflow on the same refs.
          sha=$(git rev-parse HEAD)
          for t in "v${major}" latest; do
            # PATCH with typed boolean force (capital -F sends JSON true).
            # If the ref doesn't exist yet (first release), fall back to POST.
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${t}" \
              -f "sha=${sha}" -F "force=true" >/dev/null 2>&1 ||
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f "ref=refs/tags/${t}" -f "sha=${sha}" >/dev/null
            echo "Retagged ${t} -> ${sha}"
          done