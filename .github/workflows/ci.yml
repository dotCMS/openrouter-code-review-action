name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          scan-type: fs
          scan-ref: '.'
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: .venv

  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (dev)
        run: uv sync --dev

      - name: Pre-commit (ruff format/check, mypy)
        run: uv run pre-commit run --all-files

      # Catches invalid workflow files (e.g. a non-existent permission scope),
      # which GitHub rejects wholesale — the run then never starts and the only
      # trace is a failed "workflow file issue" run.
      #
      # actionlint 1.7.12 predates the concurrency `queue` key. GitHub accepts
      # it (SchemaStore knows it), so act/release workflows use `queue: max`
      # to preserve pending jobs instead of replacing them. Ignore just that diagnostic until actionlint
      # ships the schema — everything else stays enforced.
      - name: Lint workflows (actionlint)
        run: |
          uvx --from actionlint-py==1.7.12.25 actionlint \
            -ignore 'unexpected key "queue" for "concurrency" section'

      - name: Run tests
        run: uv run pytest -q

