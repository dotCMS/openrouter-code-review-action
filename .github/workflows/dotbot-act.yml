name: dotbot code act

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  act:
    name: Act on /dotbot comments
    if: >-
      (
        (
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, '/dotbot') &&
          github.event.issue.pull_request
        ) || (
          github.event_name == 'pull_request_review_comment' &&
          startsWith(github.event.comment.body, '/dotbot')
        )
      ) &&
      github.actor != 'dependabot[bot]'
    # Job-level, not workflow-level: every comment on the repo starts this
    # workflow, and a workflow-level group is joined even when the job below is
    # skipped. A skipped run would then cancel a waiting /dotbot run. A job
    # skipped by `if:` never joins the group. queue: max keeps back-to-back
    # /dotbot requests queued instead of dropping all but the newest.
    concurrency:
      group: dotbot-act-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The agent must operate on the PR branch, but the *action code*
          # must never come from that checkout: a /dotbot comment can fire on
          # an untrusted fork/PR head, so `uses: ./` would execute
          # attacker-controlled composite steps with a write token in
          # .git/config. Pin the action to a trusted ref below instead.
          ref: ${{ github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: dotbot autonomous edits
        # Trusted main ref, NOT the PR-head checkout. Update this SHA on each
        # release (matches the v1/latest tag).
        uses: wezell/openrouter-code-review-action@d68edbb67a3365b53b41d9f05406c084bf338295
        with:
          mode: act
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          debug_level: 1