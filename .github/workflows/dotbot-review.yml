name: dotbot code review

on:
  pull_request:
    # review_requested fires both when a review is first requested AND when
    # it is re-requested, so one type covers both cases.
    types: [opened, synchronize, reopened, ready_for_review, review_requested]

concurrency:
  group: dotbot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # On review_requested, only run when the request targets the machine
    # user (re-requests land here too). All other trigger types pass through.
    if: >-
      github.event.action != 'review_requested' ||
      github.event.requested_reviewer.login == 'dotCMS-Machine-User'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # NOTE: ovh-k8s-cluster uses secrets.DOTBOT_GITHUB_USER_PAT (a machine-user
      # PAT) for these statuses; this repo now has that secret too, but the
      # workflow token still posts the statuses (statuses: write below), which
      # keeps them independent of the approval PAT.
# "Being reviewed by dotBot" is a commit status on the head SHA, not a
      # PR comment: statuses never send notification emails, and the PR's
      # checks area shows the in-progress state live. (A run cancelled by
      # concurrency leaves its pending status behind; the next run on the
      # same SHA overwrites it.)
      - name: Set "Being reviewed by dotBot" status (pending)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending \
            -f context='dotbot code review' \
            -f description='Being reviewed by dotBot' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
      # DOTBOT_REVIEW_MODELS (repo VARIABLE), when set, OVERRIDES the review
      # roster: we render .openrouter-review.yml from it and the action reads
      # that as its primary + extras. This is a REPLACEMENT, not an addition —
      # the action's `review_models` INPUT is additive (it would run the
      # variable's models alongside the default deepseek primary, which is how
      # a 3-reviewer roster happened on PR #843). First entry = primary
      # reviewer; the rest join its collaborative review panel. When the variable is
      # unset, nothing is rendered and the action's own defaults stand.
      - name: Override review roster from DOTBOT_REVIEW_MODELS (when set)
        if: ${{ vars.DOTBOT_REVIEW_MODELS != '' }}
        env:
          REVIEW_MODELS: ${{ vars.DOTBOT_REVIEW_MODELS }}
        run: |
          MODELS=()
          IFS=',' read -ra PARTS <<< "$REVIEW_MODELS"
          for p in "${PARTS[@]}"; do
            p="${p//[[:space:]]/}"
            [[ -n "${p}" ]] && MODELS+=("${p}")
          done
          if (( ${#MODELS[@]} == 0 )); then
            echo "::warning::DOTBOT_REVIEW_MODELS set but parsed empty — using action defaults"
            exit 0
          fi
          # Preserve policy, discussion limits, and act settings when replacing only the roster.
          python3 -I - "${MODELS[@]}" <<'PY'
          import sys
          from pathlib import Path
          import yaml

          path = Path(".openrouter-review.yml")
          config = yaml.safe_load(path.read_text()) if path.exists() else {}
          if config is None:
              config = {}
          if not isinstance(config, dict):
              raise SystemExit("Model config must be a mapping")
          review = config.setdefault("review", {})
          if not isinstance(review, dict):
              raise SystemExit("review config must be a mapping")
          review["model"] = sys.argv[1]
          review.pop("models", None)
          if len(sys.argv) > 2:
              review["models"] = sys.argv[2:]
          path.write_text(yaml.safe_dump(config, sort_keys=False))
          PY
          echo "Updated review roster from DOTBOT_REVIEW_MODELS"
      # Exercise the validated v2 candidate before releasing it. This fixed,
      # maintainer-selected SHA never follows arbitrary PR-head code or `./`.
      # Update this pin explicitly when adopting a newer reviewed action version.
      - name: dotbot autonomous review
        id: dotbot
        uses: dotCMS/openrouter-code-review-action@d5e8401709800cf731779d4225afec375133ac0a
        with:
          mode: review
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: deepseek/deepseek-v4-pro-0813
          # Auto-approval follows review.decision.policy (unanimous by default).
          # DOTBOT_GITHUB_USER_PAT (the machine user, dotCMS-Machine-User) is
          # preferred: the approval is a named-user approval, and the token's
          # user must differ from the PR author or GitHub rejects it. Falls back
          # to the workflow token so a repo without the secret still approves —
          # that lands as github-actions[bot] (allowed here: Settings → Actions →
          # "Allow GitHub Actions to create and approve pull requests").
          github_approval_token: ${{ secrets.DOTBOT_GITHUB_USER_PAT || github.token }}
          reasoning_effort: medium
          web_search_mode: cached
          additional_prompt: >-
            The reviewed repository root is ${{ github.workspace }}.
            Build every code_location.absolute_file_path from this exact root
            and the repository-relative path; never guess a checkout prefix.
          debug_level: 1
      # Review finished — flip the status to completed. success/failure
      # reflects the review run itself, not the review's verdict on the patch.
      - name: Set dotbot review status (completed)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.dotbot.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = "success" ] && state=success
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$state" \
            -f context='dotbot code review' \
            -f description='dotbot review finished' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
