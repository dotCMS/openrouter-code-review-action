[mypy]
python_version = 3.12
pretty = True
explicit_package_bases = True
mypy_path = .

[mypy-github]
ignore_missing_imports = True
[mypy-github.*]
ignore_missing_imports = True

# Installed only for the bedrock provider (requirements-bedrock.txt).
[mypy-aws_bedrock_token_generator]
ignore_missing_imports = True

[mypy-codex]
ignore_missing_imports = True
[mypy-codex.*]
ignore_missing_imports = True

[mypy-pytest]
ignore_missing_imports = True
[mypy-pytest.*]
ignore_missing_imports = True

[mypy-yaml]
ignore_missing_imports = True
[mypy-yaml.*]
ignore_missing_imports = True
