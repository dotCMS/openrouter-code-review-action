# Sample PR registry for the Codex → OpenRouter bake-off.
#
# Selection criteria, labeling rubric, and FP definition live in
# eval/baseline-methodology.md. This file is the *registry* — the fixed
# list of (repo, pr, pr_head_sha, pr_base_sha) revisions that every
# bake-off scores against.
#
# Sub-AC 1.1.1 selected the 10-PR sample; the long-form rationale lives
# at evaluation/bakeoff/sample-prs.{md,yml}. This file is the canonical
# machine-readable registry that downstream bake-off Sub-ACs (1.2 Codex
# baseline; 1.3 OpenRouter run; 1.4 labeling; 1.5 scoring) consume,
# matching the path referenced in baseline-methodology.md §1.5 / §4.1.

# Ordered slot keys mirrored from baseline-methodology.md §1.3.
# At least these slots must be covered across the populated `prs:` list.
required_slots:
  - real_bug_present       # ≥ 2 PRs
  - clean_diff             # ≥ 2 PRs
  - continuation           # ≥ 1 PR (synchronize push after prior review)
  - force_push_ancestry    # ≥ 1 PR (head SHA breaks reviewed-SHA ancestry)
  - web_search_relevant    # ≥ 1 PR (CVE / deprecated API / dep bump)
  - multiline_suggestion   # ≥ 1 PR

# Required language coverage across the populated `prs:` list (§1.2 rule 6).
required_language_coverage:
  - python
  - typescript_or_javascript
  - java_or_kotlin
  - yaml_action_or_config
  - tests

# Hard bounds enforced by reviewers when populating the registry.
size_bounds:
  min_loc_changed: 20
  max_loc_changed: 1500

# Sample size bounds (per seed.yaml AC 1).
sample_size:
  min: 5
  max: 10

# ---------------------------------------------------------------------------
# Concrete sample. Synced from Sub-AC 1.1.1 selection at
# evaluation/bakeoff/sample-prs.yml.
#
# Revision semantics (read carefully):
#   * `pr_head_sha` — the actual PR head commit under review. New
#     consumers MUST pin this revision.
#   * `pr_base_sha` — the PR's merge-base commit; the reviewed diff is
#     `pr_base_sha...pr_head_sha`.
#   * `head_sha` — LEGACY alias retained for backward compatibility
#     ONLY. It holds the PR's *merge commit* SHA, NOT the PR head. It is
#     the value eval/labeled_dataset/schema.py binds the human-labeled
#     historical corpus to, so it must never be repurposed, migrated, or
#     silently relabeled. The Codex runner exposes it as `merge_sha`.
# ---------------------------------------------------------------------------
