name: "dotbot code review & actor"
description: "Run dotbot to review a PR and post review comments"
author: "dotbot"
branding:
  icon: "search"
  color: "blue"

inputs:
  mode:
    description: "Operation mode: review | act"
    required: false
    default: "review"
  openai_api_key:
    description: "OpenAI API key for the selected model provider"
    required: false
  openrouter_api_key:
    description: "OpenRouter API key used for all routed model calls"
    required: false
  github_approval_token:
    description: >-
      Token used to submit the approval review when the final configured
      decision policy accepts the patch (unanimous by default). Usually a GitHub user PAT owned by a machine
      user (e.g. dotCMS-Machine-User, secret DOTBOT_GITHUB_USER_PAT) so the
      approval is attributed to a named user. The workflow token works too (pass
      it from the calling workflow) — the approval then shows as
      github-actions[bot], and the repo must allow Actions to approve pull
      requests. Leave empty to disable auto-approval and just post review
      comments normally. Note: no expression may appear in this description; an
      input description is evaluated without the github context, and using one
      there makes GitHub reject the whole action.yml.
    required: false
    default: ""
  config_path:
    description: >-
      Path (relative to the consuming repo's checkout) to the in-repo OpenRouter
      model config file. Edit that file to swap review or act model — no code
      change required. Defaults to .openrouter-review.yml at the repo root.
    required: false
    default: ".openrouter-review.yml"
  model:
    description: "Model to use (e.g., gpt-5, gpt-4.1-mini)"
    required: false
    default: "gpt-5.4"
  review_models:
    description: "Comma-separated extra OpenRouter review models for concurrent investigation and shared discussion before one final review"
    required: false
    default: ""
  reasoning_effort:
    description: "Reasoning effort: minimal | low | medium | high"
    required: false
    default: "medium"
  model_timeout_seconds:
    description: >-
      Wall-clock budget in seconds for each reviewer model pass. A wedged
      model (endless reasoning trace or tool loop) is aborted instead of
      burning credits. 0 disables the cap.
    required: false
    default: "900"
  web_search_mode:
    description: "Web search mode: disabled | cached | live"
    required: false
    default: "live"
  debug_level:
    description: "Debug verbosity: 0 (off), 1 (basic), 2 (trace)"
    required: false
    default: "1"
  dry_run:
    description: "If '1', print payloads but do not post comments"
    required: false
    default: "0"
  stream_agent_messages:
    description: "If '1', stream model output, or attributed panel discussion messages, to logs"
    required: false
    default: "1"
  act_instructions:
    description: "Additional instructions for act mode (autonomous editing)"
    required: false
    default: ""
  allowed_commenter_associations:
    description: "Comma-separated GitHub comment author_association values allowed to trigger act mode"
    required: false
    default: "MEMBER,OWNER,COLLABORATOR"
  additional_prompt:
    description: "Extra reviewer instructions appended to the review prompt (verbatim)"
    required: false
    default: ""
  resolve_stale_threads:
    description: >-
      If '1', resolve (close) prior unresolved dotbot review threads that the
      reviewer model saw but declined to carry forward — i.e. threads the
      model judged stale or already fixed. Threads whose code no longer
      matches the file (never shown to the model) are left for a human.
    required: false
    default: "0"
  extra_pip_args:
    description: "Additional pip arguments (e.g., --index-url)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Mark review in progress
      id: review_status
      if: inputs.mode == 'review' && inputs.dry_run != '1'
      uses: actions/github-script@v7
      env:
        DOTBOT_ACTION_PATH: ${{ github.action_path }}
      with:
        script: |
          const report = require(`${process.env.DOTBOT_ACTION_PATH}/scripts/review-status.cjs`);
          return await report({ github, context, core, status: 'in_progress' });

    - name: Validate inputs
      shell: bash
      run: |
        set -euo pipefail
        valid_efforts="minimal low medium high"
        valid_search_modes="disabled cached live"
        contains_word() { case " $1 " in *" $2 "*) return 0;; *) return 1;; esac; }
        # Mode
        case "${{ inputs.mode }}" in review|act) :;; *) echo "::error::Invalid mode: ${{ inputs.mode }} (allowed: review|act)"; exit 2;; esac
        # Reasoning efforts
        if ! contains_word "$valid_efforts" "${{ inputs.reasoning_effort }}"; then
          echo "::error::Invalid reasoning_effort: ${{ inputs.reasoning_effort }} (allowed: minimal|low|medium|high)"; exit 2;
        fi
        # Web search mode
        if ! contains_word "$valid_search_modes" "${{ inputs.web_search_mode }}"; then
          echo "::error::Invalid web_search_mode: ${{ inputs.web_search_mode }} (allowed: disabled|cached|live)"; exit 2;
        fi
    - name: Install Python dependencies
      shell: bash
      env:
        DOTBOT_PROVIDER: ${{ env.DOTBOT_PROVIDER }}
      run: |
        set -euo pipefail
        python3 -m pip install --upgrade pip
        python3 -m pip install ${{ inputs.extra_pip_args }} -r "${{ github.action_path }}/requirements.txt"
        # The legacy openai (Codex SDK) provider carries a large dependency and
        # is only valid for act mode; review is OpenRouter-only.
        if [ "${{ inputs.mode }}" = "act" ] && [ "${DOTBOT_PROVIDER:-openrouter}" = "openai" ]; then
          python3 -m pip install ${{ inputs.extra_pip_args }} -r "${{ github.action_path }}/requirements-openai.txt"
        fi

    - name: Run dotbot autonomous review (CLI)
      id: run_dotbot_cli
      shell: bash
      env:
        # Tokens
        GITHUB_TOKEN: ${{ github.token }}
        DOTBOT_GITHUB_USER_PAT: ${{ inputs.github_approval_token }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        # Config
        DOTBOT_MODE: ${{ inputs.mode }}
        DOTBOT_REVIEW_STATUS_COMMENT_ID: ${{ steps.review_status.outputs.result }}
        DOTBOT_MODEL: ${{ inputs.model }}
        DOTBOT_REVIEW_MODELS: ${{ inputs.review_models }}
        # In-repo model config — single edit swaps the review/act model.
        OPENROUTER_REVIEW_CONFIG: ${{ inputs.config_path }}
        DOTBOT_REASONING_EFFORT: ${{ inputs.reasoning_effort }}
        DOTBOT_MODEL_TIMEOUT_SECONDS: ${{ inputs.model_timeout_seconds }}
        DOTBOT_WEB_SEARCH_MODE: ${{ inputs.web_search_mode }}
        DOTBOT_ACT_INSTRUCTIONS: ${{ inputs.act_instructions }}
        DOTBOT_ALLOWED_COMMENTER_ASSOCIATIONS: ${{ inputs.allowed_commenter_associations }}
        DOTBOT_ADDITIONAL_PROMPT: ${{ inputs.additional_prompt }}
        DOTBOT_RESOLVE_STALE_THREADS: ${{ inputs.resolve_stale_threads }}
        DEBUG_CODEREVIEW: ${{ inputs.debug_level }}
        DRY_RUN: ${{ inputs.dry_run }}
        STREAM_AGENT_MESSAGES: ${{ inputs.stream_agent_messages }}
        # AC-6: ensure Python does not buffer stdout/stderr so token
        # deltas reach the GitHub Actions live log as soon as the
        # OpenRouter SSE stream emits them.
        PYTHONUNBUFFERED: "1"
        # Without this, a checkout containing its own `cli/` package shadows
        # the pinned action's code (`python -m` prefers the cwd). For act mode
        # that means running PR-head code with a write token — the exact
        # escalation the trusted ref pin exists to prevent.
        PYTHONSAFEPATH: "1"
        # Conversation threads for the OpenRouter agent loop live here.
        OPENROUTER_THREAD_DIR: ${{ runner.temp }}/openrouter-review-threads
      run: |
        set -euo pipefail
        # Execute the CLI directly; it detects GitHub Actions via env.
        # ``-u`` belt-and-braces with PYTHONUNBUFFERED above so streaming
        # output is forwarded to the GH Actions log line-by-line.
        PYTHONPATH="${{ github.action_path }}:${PYTHONPATH:-}" \
          python3 -u -m cli.main

    - name: Report unsuccessful review
      if: always() && inputs.mode == 'review' && inputs.dry_run != '1' && (failure() || cancelled())
      uses: actions/github-script@v7
      env:
        DOTBOT_ACTION_PATH: ${{ github.action_path }}
        REVIEW_JOB_STATUS: ${{ job.status }}
      with:
        script: |
          const report = require(`${process.env.DOTBOT_ACTION_PATH}/scripts/review-status.cjs`);
          const status = process.env.REVIEW_JOB_STATUS === 'cancelled' ? 'cancelled' : 'failed';
          await report({ github, context, core, status });
