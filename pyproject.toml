[project]
# Minimal project metadata for uv; this is not published.
name = "dotbot-code-review-action"
version = "0.0.0"
description = "GitHub Action for dotbot autonomous PR reviews and edits"
readme = "README.md"
# <3.15: pydantic-core has no wheels for 3.15 yet and cannot build from source there.
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic==2.12.5",
  "PyGithub==2.8.1",
  "PyYAML==6.0.3",
]

[tool.uv]
# Treat repo as non-packaged (no editable build performed by uv)
package = false
# Supply-chain cooldown: only resolve releases that have been public for 3 days.
exclude-newer = "3 days"

[dependency-groups]
dev = [
  "codex-python==1.122.0",  # legacy openai provider + eval Codex baseline
  "ruff",
  "mypy",
  "pytest",
  "pre-commit",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle (incl. E402; we ignore E501 separately)
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cli"]
